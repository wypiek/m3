[package]
name = "m3-browser"
description = "The m3 web browser: tabs, Material 3 Expressive chrome (WebKitGTK)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "m3-browser"
path = "src/main.rs"

[dependencies]
m3-core.workspace = true
m3-theme.workspace = true
m3-widgets.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_49"] }
webkit6 = { version = "0.6.1", features = ["v2_50"] }

[lints]
workspace = true
