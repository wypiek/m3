[package]
name = "m3-terminal"
description = "The m3 terminal: tabs, Material 3 Expressive styling, theme-derived colours (VTE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "m3-terminal"
path = "src/main.rs"

[dependencies]
m3-core.workspace = true
m3-theme.workspace = true
m3-widgets.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_49"] }
vte4 = { version = "0.10.0", features = ["v0_70"] }

[lints]
workspace = true
