[package]
name = "m3-files"
description = "The m3 file manager: Material 3 Expressive, GIO-based (local files, trash, mounts)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "m3-files"
path = "src/main.rs"

[dependencies]
m3-core.workspace = true
m3-theme.workspace = true
m3-widgets.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_49"] }

[lints]
workspace = true
