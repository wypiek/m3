# xdg-desktop-portal backend selection for XDG_CURRENT_DESKTOP=m3.
# File chooser, settings, open-URI etc. come from the GTK portal.
# Screenshots and screen casting go through xdg-desktop-portal-wlr, which
# uses the compositor's wlr-screencopy support (install it to share screens
# in browsers and video calls).
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
